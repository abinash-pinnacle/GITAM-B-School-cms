# Frontend (Nginx): serves static files and proxies /api to the backend container
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls -> backend container
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # app code (HTML/CSS/JS) — never cache, warna rebuild ke baad browser
    # purani file dikhata rehta hai
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # the manifest needs its own MIME type, and the service worker must never
    # be cached or an old one keeps serving a stale shell after a redeploy
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Digital Asset Links — Chrome fetches this to verify the Android app owns
    # the domain. It must be JSON and must not be rewritten to index.html.
    location = /.well-known/assetlinks.json {
        types { } default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # the Android app itself
    location /apk/ {
        types { } default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}

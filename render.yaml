# Render.com blueprint — deploys the NMIET CMS using the Dockerfile.
# Render sets the PORT env var; Apache is configured to listen on it.
services:
  - type: web
    name: nmiet-cms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # must match the Neon region — /api/bootstrap makes a lot of round trips
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The free plan has no persistent disk, so SQLite would be wiped on every
      # redeploy — point the app at a hosted Postgres instead. The connection
      # details are marked sync:false and are filled in from the dashboard.
      - key: DB_BACKEND
        value: pgsql
      - key: PGSSLMODE
        value: require
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false

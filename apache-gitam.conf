# Apache config for the single-container (Render) image.
#
# api/.htaccess drives the REST routes, so overrides must be allowed.
<Directory /var/www/html>
    AllowOverride All
</Directory>

# App code must NEVER be cached. Without an explicit Cache-Control, Apache
# sends only ETag/Last-Modified and browsers fall back to *heuristic*
# freshness (roughly 10% of the file's age) — iOS Safari then happily serves
# a days-old app.js after a deploy, so users see an old UI with menus and
# roles missing. no-store keeps every client on the deployed build.
<FilesMatch "\.(html|js|css|webmanifest)$">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
    Header set Pragma "no-cache"
</FilesMatch>

# The service worker decides what every installed client sees; a stale one
# can pin an old shell indefinitely.
<Files "sw.js">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
</Files>

# The API is live data — never cache a student list or a fee balance.
<LocationMatch "^/api/">
    Header set Cache-Control "no-store"
</LocationMatch>

# Media does not change without a new filename, so let it cache hard.
<FilesMatch "\.(png|jpg|jpeg|webp|gif|svg|ico|woff2?)$">
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>

# The manifest needs its own MIME type or the browser ignores it, and
# Digital Asset Links must be served as JSON for the Android app to verify.
AddType application/manifest+json .webmanifest
AddType application/vnd.android.package-archive .apk

# `COPY . .` puts the build files in the web root too — they are not secret,
# but there is no reason to serve them.
<FilesMatch "^(Dockerfile|.*\.Dockerfile|apache-gitam\.conf|nginx\.conf|docker-compose\.ya?ml|server\.py)$">
    Require all denied
</FilesMatch>

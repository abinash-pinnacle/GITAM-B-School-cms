# GITAM CMS — 4-container setup
#   frontend (Nginx)  ->  backend (PHP API)  ->  db (MySQL)
#                                              phpmyadmin (DB ka UI)
#
#   docker compose -p gitam up -d --build   # sab build + start
#   open http://localhost:5510              # app
#   open http://localhost:8081              # phpMyAdmin
#   docker compose -p gitam down            # stop (database volume is kept)
#
# Ports 5500/8080 par doosra project (gclone) chalta hai, isliye ye stack
# 5510/8081 use karta hai — dono saath chal sakte hain.
#
# Demo project hai, isliye passwords plain rakhe hain — production me badalna.

# Project ka naam pin — warna Compose folder ka naam ("gitam clone") use karta
# hai aur Docker Desktop me group ka naam badal jata hai.
name: gitam

services:
  # 🟨 Database — MySQL (phpMyAdmin isi ko dikhata hai)
  db:
    image: mysql:8
    container_name: gitam-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gitam
      MYSQL_USER: gitam
      MYSQL_PASSWORD: gitam
    volumes:
      - gitam-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 🟩 Backend — PHP REST API
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: gitam-backend
    environment:
      DB_BACKEND: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: gitam
      DB_USER: gitam
      DB_PASS: gitam
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  # 🟦 Frontend — Nginx (static UI + /api proxy)
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: gitam-frontend
    ports:
      - "5510:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 🟧 phpMyAdmin — database ka web UI (http://localhost:8081)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: gitam-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: root          # seedha login ho jata hai
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gitam-mysqldata:
